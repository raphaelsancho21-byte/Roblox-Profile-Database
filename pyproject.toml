[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-profile-database-cli"
version = "2.1.0"
description = "Interface interativa no terminal para consulta de perfis públicos Roblox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<15", "reportlab>=4,<5"] 
license = {text = "MIT"}

[project.scripts]
robloxdb = "robloxdb_cli:main"

[tool.setuptools]
py-modules = ["robloxdb_cli", "robloxdb_tui", "robloxdb_visual", "robloxdb_v2", "robloxdb_v2_tui", "robloxdb_pdf", "robloxdb_presence", "robloxdb_accounts"]
packages = ["src"]
