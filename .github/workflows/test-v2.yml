name: Testar RobloxDB V2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar pacote
        run: python -m pip install .
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Verificar CLI
        run: robloxdb --help
      - name: Testar módulos locais
        run: python -m unittest discover -s tests -v
