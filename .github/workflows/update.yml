name: Atualizar perfil Roblox
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Roblox UserId positivo'
        required: true
        type: string
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar ID
        env:
          USER_ID: ${{ inputs.user_id }}
        run: |
          [[ "$USER_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
      - name: Consultar perfil público
        env:
          USER_ID: ${{ inputs.user_id }}
        run: python src/main.py --id "$USER_ID"
      - name: Publicar snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/profiles/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar perfil público Roblox'
            git push
          fi
